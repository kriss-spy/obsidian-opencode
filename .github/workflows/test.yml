name: Test

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/compatibility.yml
    with:
      commit: ${{ github.sha }}

  compatibility:
    # Stable check name for branch protection, independent of matrix changes.
    name: Required compatibility
    if: always()
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful validation
        env:
          RESULT: ${{ needs.validate.result }}
        run: test "$RESULT" = success
