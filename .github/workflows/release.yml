name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build
        run: |
          npm ci
          npm test
          npm run build

      - name: Validate release identity and assets
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const read = name => JSON.parse(fs.readFileSync(name, 'utf8'));
          const version = process.env.RELEASE_VERSION;
          const manifest = read('manifest.json');
          const lock = read('package-lock.json');
          const versions = [manifest.version, read('package.json').version, lock.version, lock.packages[''].version];
          if (versions.some(value => value !== version)) throw new Error('Tag and package versions must match');
          if (read('versions.json')[version] !== manifest.minAppVersion) throw new Error('Compatibility mapping must match');
          for (const name of ['main.js', 'manifest.json', 'styles.css', `docs/releases/${version}.md`]) {
            if (!fs.statSync(name).size) throw new Error(`Empty release asset: ${name}`);
          }
          JS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            main.js
            manifest.json
            styles.css
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest main.js
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: main.js

      - name: Attest styles.css
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: styles.css
